<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>ATIC | Logística de Amostras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --accent: #4f46e5; --radius: 16px; }
    body { background: radial-gradient(circle at top left, #eef2ff, #f9fafb); min-height: 100vh; font-family: sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-radius: var(--radius); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .step-active { color: var(--accent); border-bottom: 3px solid var(--accent); font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-2xl mx-auto">
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-black text-slate-800 tracking-tighter">ATIC | <span class="text-indigo-600">OS</span></h1>
      <button id="logoutBtn" class="hidden bg-white text-red-500 text-[10px] font-bold px-4 py-2 rounded-xl border border-red-100 shadow-sm">SAIR</button>
    </header>

    <div class="glass-card p-4 mb-6 flex justify-around text-[10px] uppercase font-bold text-slate-400 tracking-widest">
        <span id="step1">1. Identificação</span>
        <span id="step2">2. Ordem Serviço</span>
        <span id="step3">3. Amostras</span>
    </div>

    <div id="scanner-container" class="hidden mb-6">
        <div class="glass-card overflow-hidden border-4 border-indigo-500 shadow-2xl">
            <div id="reader" class="w-full bg-black"></div>
        </div>
        <button id="btnStopScan" class="w-full mt-4 bg-slate-900 text-white py-4 rounded-2xl font-bold">FECHAR CÂMERA</button>
    </div>

    <div id="main-panel" class="space-y-4">
        
        <section id="section-login" class="hidden">
            <button onclick="startScanning('LOGIN')" class="w-full py-16 bg-indigo-600 text-white rounded-[2rem] shadow-xl flex flex-col items-center gap-4">
                <span class="text-4xl">👤</span>
                <span class="text-xl font-bold uppercase tracking-tight">Identificar Usuário</span>
            </button>
        </section>

        <section id="section-os" class="hidden space-y-4">
            <div class="glass-card p-4 text-sm text-slate-600">Logado como: <b id="display-user" class="text-slate-900"></b></div>
            <button onclick="startScanning('OS')" class="w-full py-12 bg-emerald-600 text-white rounded-[2rem] shadow-xl font-bold text-lg uppercase">
                Ler QR Code da OS
            </button>
            <div class="relative py-2"><div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div><div class="relative flex justify-center text-[10px] uppercase text-slate-400 font-bold"><span class="bg-[#f9fafb] px-2">Ou digite manualmente</span></div></div>
            <div class="flex gap-2">
                <input type="text" id="manualOS" placeholder="SAO00250/2026" class="flex-1 p-4 rounded-2xl border border-slate-200 outline-none font-bold text-slate-700">
                <button onclick="confirmManualOS()" class="bg-slate-800 text-white px-6 rounded-2xl font-bold uppercase text-xs">OK</button>
            </div>
        </section>

        <section id="section-amostra" class="hidden space-y-4">
            <div class="flex gap-2">
                <div class="glass-card p-4 flex-1">
                    <p class="text-[10px] text-slate-400 uppercase font-bold leading-none mb-1">OS Operação</p>
                    <p id="display-os" class="text-lg font-black text-indigo-600"></p>
                </div>
                <button onclick="trocarOS()" class="bg-white border px-4 rounded-2xl text-[10px] font-bold text-slate-500 uppercase">Trocar OS</button>
            </div>
            <button onclick="startScanning('AMOSTRA')" class="w-full py-20 bg-indigo-600 text-white rounded-[2rem] shadow-xl flex flex-col items-center justify-center gap-4">
                <div class="bg-white/20 p-4 rounded-full text-white">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <span class="text-2xl font-black uppercase italic">Coletar Amostra</span>
            </button>
        </section>
    </div>

    <section class="mt-10">
        <div class="flex justify-between items-end mb-4 px-2">
            <div>
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Registros</h3>
                <p class="text-2xl font-black text-slate-800"><span id="metric-total">0</span> <span class="text-sm font-normal text-slate-400">itens</span></p>
            </div>
            <button onclick="exportToExcel()" class="bg-white border border-slate-200 text-[10px] font-bold px-4 py-2 rounded-xl shadow-sm uppercase">Exportar Planilha</button>
        </div>
        <div class="glass-card overflow-hidden">
            <table id="main-table" class="w-full text-left text-xs">
                <thead><tr class="bg-slate-50 text-slate-400 font-bold uppercase border-b border-slate-100"><th class="p-4">Amostra</th><th class="p-4">Data/Hora</th><th class="p-4 text-center">Ação</th></tr></thead>
                <tbody id="logTable" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </section>

    <div id="splash" class="hidden fixed inset-0 flex items-center justify-center bg-indigo-600/90 backdrop-blur-md z-50 text-white">
        <div class="text-center"><div class="text-6xl mb-2 font-bold">✓</div><div class="text-sm font-bold uppercase tracking-widest">Processado</div></div>
    </div>
  </div>

  <script>
    // --- ESTADO ---
    let appState = {
        user: JSON.parse(localStorage.getItem('atic_user')) || null,
        os: null,
        logs: JSON.parse(localStorage.getItem('atic_logs')) || []
    };

    const html5QrCode = new Html5Qrcode("reader");

    // --- REGRAS DE VALIDAÇÃO ---
    const REGEX_OS = /^[A-Z]{3}\d{5}\/\d{4}(#[A-Z])?$/;
    const TAMANHO_AMOSTRA = 8;

    function updateUI() {
        // Esconder Seções
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-os').classList.add('hidden');
        document.getElementById('section-amostra').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        
        // Reset Stepper
        document.querySelectorAll('[id^="step"]').forEach(s => s.classList.remove('step-active'));

        if (!appState.user) {
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('step1').classList.add('step-active');
        } else if (!appState.os) {
            document.getElementById('section-os').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('display-user').innerText = appState.user.nome;
            document.getElementById('step2').classList.add('step-active');
        } else {
            document.getElementById('section-amostra').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('display-os').innerText = appState.os;
            document.getElementById('step3').classList.add('step-active');
        }

        document.getElementById('metric-total').innerText = appState.logs.length;
        renderLogs();
    }

    async function startScanning(type) {
        // Limpar scanner anterior se existir
        if (html5QrCode.getState() !== 1) await html5QrCode.stop();

        document.getElementById('main-panel').classList.add('hidden');
        document.getElementById('scanner-container').classList.remove('hidden');
        
        const config = { 
            fps: 15, 
            qrbox: { width: 260, height: 180 },
            formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.ITF ]
        };

        html5QrCode.start({ facingMode: "environment" }, config, (text) => {
            processData(type, text);
        }).catch(err => {
            alert("Erro na câmera: " + err);
            stopScanning();
        });
    }

    async function stopScanning() {
        if (html5QrCode.getState() !== 1) {
            await html5QrCode.stop();
        }
        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('main-panel').classList.remove('hidden');
    }

    async function processData(type, data) {
        const value = data.trim().toUpperCase();

        if (type === 'LOGIN') {
            const parts = value.split(';');
            if (parts.length >= 2) {
                appState.user = { nome: parts[0], id: parts[1] };
                localStorage.setItem('atic_user', JSON.stringify(appState.user));
                await finalizeAction();
            } else alert("QR Code Inválido!");
        } 
        
        else if (type === 'OS') {
            if (REGEX_OS.test(value)) {
                appState.os = value;
                await finalizeAction();
            } else {
                alert("Ordem de serviço inválida, tente novamente");
            }
        } 
        
        else if (type === 'AMOSTRA') {
            if (!/^\d+$/.test(value) || value.length !== TAMANHO_AMOSTRA) {
                alert("Erro, por favor refaça a leitura (Obrigatório 8 dígitos)");
                return;
            }
            if (appState.logs.find(l => l.amostra === value && l.os === appState.os)) {
                alert("Amostra já coletada!");
                return;
            }
            appState.logs.push({
                id: Date.now(),
                os: appState.os,
                amostra: value,
                usuario: appState.user.nome,
                dataHora: new Date().toLocaleString('pt-BR')
            });
            localStorage.setItem('atic_logs', JSON.stringify(appState.logs));
            await finalizeAction();
        }
    }

    async function finalizeAction() {
        triggerSplash();
        await stopScanning();
        updateUI();
    }

    function confirmManualOS() {
        const input = document.getElementById('manualOS').value;
        processData('OS', input);
        document.getElementById('manualOS').value = "";
    }

    function triggerSplash() {
        const s = document.getElementById('splash');
        s.classList.remove('hidden');
        setTimeout(() => s.classList.add('hidden'), 800);
    }

    function trocarOS() { appState.os = null; updateUI(); }

    function deleteLog(id) {
        if (confirm("Excluir este registro?")) {
            appState.logs = appState.logs.filter(l => l.id !== id);
            localStorage.setItem('atic_logs', JSON.stringify(appState.logs));
            updateUI();
        }
    }

    function renderLogs() {
        const list = document.getElementById('logTable');
        list.innerHTML = appState.logs.slice().reverse().map(l => `
            <tr class="hover:bg-slate-50">
                <td class="p-4 font-black text-indigo-600">${l.amostra}</td>
                <td class="p-4 text-slate-500">${l.dataHora}</td>
                <td class="p-4 text-center">
                    <button onclick="deleteLog(${l.id})" class="text-red-400 font-bold hover:text-red-600">×</button>
                </td>
            </tr>
        `).join('');
    }

    function exportToExcel() {
        if (appState.logs.length === 0) return alert("Nenhum dado para exportar");
        const worksheet = XLSX.utils.json_to_sheet(appState.logs);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Amostras");
        XLSX.writeFile(workbook, "coleta_amostras.xlsx");
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('atic_user');
        appState.user = null; appState.os = null; updateUI();
    });

    document.getElementById('btnStopScan').addEventListener('click', stopScanning);

    // Init
    updateUI();
  </script>
</body>
</html>
