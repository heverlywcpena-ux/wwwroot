<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>ATIC | Logística de Amostras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root { --accent: #4f46e5; --radius: 20px; }
    body { background: radial-gradient(circle at top left, #eef2ff, #f9fafb); min-height: 100vh; font-family: system-ui, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-radius: var(--radius); border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .step-active { color: var(--accent); border-bottom: 3px solid var(--accent); font-weight: bold; }
    .btn-primary { background: var(--accent); color: white; transition: all 0.2s; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
    .hidden { display: none !important; }
    /* Ajuste para garantir que o scanner ocupe bem a tela */
    #reader { border-radius: var(--radius); overflow: hidden; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-2xl mx-auto">
    <header class="flex justify-between items-start mb-8">
      <div>
        <div class="inline-block px-3 py-1 rounded-full bg-indigo-100 text-indigo-600 text-[10px] font-bold uppercase tracking-widest mb-2">Operacional</div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tighter">ATIC <span class="text-indigo-600">Amostras</span></h1>
      </div>
      <button id="logoutBtn" class="hidden bg-white text-red-500 text-[10px] font-bold px-4 py-2 rounded-xl border border-red-100 shadow-sm uppercase tracking-wider">Sair</button>
    </header>

    <nav class="glass-card p-4 mb-8 flex justify-around text-[10px] uppercase font-bold text-slate-400 tracking-widest">
        <span id="step1" class="pb-1">1. Login</span>
        <span id="step2" class="pb-1">2. Ordem Serviço</span>
        <span id="step3" class="pb-1">3. Coleta</span>
    </nav>

    <div id="scanner-container" class="hidden mb-8">
        <div class="glass-card overflow-hidden border-4 border-indigo-600 shadow-2xl">
            <div id="reader" class="w-full bg-black"></div>
        </div>
        <button id="btnStopScan" class="w-full mt-4 bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase tracking-widest shadow-lg">Fechar Câmera</button>
    </div>

    <div id="main-panel" class="space-y-6">
        
        <section id="section-login" class="hidden">
            <button onclick="startScanning('LOGIN')" class="btn-primary w-full py-16 rounded-[2.5rem] shadow-xl flex flex-col items-center gap-4">
                <div class="bg-white/20 p-4 rounded-2xl"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
                <span class="text-xl font-bold uppercase tracking-tight">Identificar Operador</span>
            </button>
        </section>

        <section id="section-os" class="hidden space-y-4">
            <div class="glass-card p-5 border-l-4 border-indigo-500">
                <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Operador Logado</p>
                <p id="display-user" class="text-lg font-bold text-slate-800"></p>
            </div>
            <button onclick="startScanning('OS')" class="bg-emerald-600 text-white w-full py-12 rounded-[2.5rem] shadow-xl font-bold text-lg uppercase tracking-tight flex flex-col items-center gap-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Ler QR Code da OS
            </button>
            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200"></span></div>
                <div class="relative flex justify-center text-[10px] uppercase text-slate-400 font-bold"><span class="bg-[#f9fafb] px-3 tracking-widest">Ou Digite Manualmente</span></div>
            </div>
            <div class="flex gap-3">
                <input type="text" id="manualOS" placeholder="Ex: SAO00250/2026" class="flex-1 p-4 rounded-2xl border border-slate-200 outline-none font-bold text-slate-700 shadow-sm focus:border-indigo-500 transition-all">
                <button onclick="confirmManualOS()" class="bg-slate-900 text-white px-8 rounded-2xl font-bold uppercase text-xs shadow-md">OK</button>
            </div>
        </section>

        <section id="section-amostra" class="hidden space-y-6">
            <div class="flex gap-3">
                <div class="glass-card p-5 flex-1 border-l-4 border-indigo-600">
                    <p class="text-[10px] text-slate-400 uppercase font-bold mb-1">OS em Aberto</p>
                    <p id="display-os" class="text-xl font-black text-indigo-600 tracking-tight"></p>
                </div>
                <button onclick="trocarOS()" class="bg-white border-2 border-slate-100 px-6 rounded-[20px] text-[10px] font-bold text-slate-500 uppercase hover:bg-slate-50 transition-colors">Trocar OS</button>
            </div>
            <button onclick="startScanning('AMOSTRA')" class="btn-primary w-full py-20 rounded-[3rem] shadow-2xl flex flex-col items-center justify-center gap-5">
                <div class="bg-white/20 p-6 rounded-full shadow-inner">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-black uppercase italic tracking-tighter block">Coletar Amostra</span>
                    <span class="text-[10px] opacity-70 font-bold uppercase tracking-[0.2em]">Leitura Barcode I25</span>
                </div>
            </button>
        </section>
    </div>

    <section class="mt-12">
        <div class="flex justify-between items-end mb-4 px-2">
            <div>
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.15em]">Histórico Local</h3>
                <p class="text-3xl font-black text-slate-900"><span id="metric-total">0</span> <span class="text-sm font-medium text-slate-400">leituras</span></p>
            </div>
            <button onclick="exportToExcel()" class="bg-indigo-600 text-white text-[10px] font-bold px-5 py-2.5 rounded-xl shadow-lg uppercase tracking-wider hover:bg-indigo-700 transition-all">Exportar Excel</button>
        </div>
        <div class="glass-card overflow-hidden">
            <div class="overflow-x-auto">
                <table id="main-table" class="w-full text-left text-xs">
                    <thead>
                        <tr class="bg-slate-50/50 text-slate-400 font-bold uppercase border-b border-slate-100">
                            <th class="p-4">Dados Operação</th>
                            <th class="p-4">Amostra (8D)</th>
                            <th class="p-4">Data/Hora</th>
                            <th class="p-4 text-center">Excluir</th>
                        </tr>
                    </thead>
                    <tbody id="logTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </section>

    <div id="splash" class="hidden fixed inset-0 flex items-center justify-center bg-indigo-600/95 backdrop-blur-md z-50 text-white">
        <div class="text-center animate-bounce">
            <div class="bg-white text-indigo-600 rounded-full w-24 h-24 flex items-center justify-center text-5xl mx-auto mb-4 shadow-2xl font-bold">✓</div>
            <h2 class="text-2xl font-black uppercase tracking-tighter">Registrado</h2>
        </div>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL ---
    let appState = {
        user: JSON.parse(localStorage.getItem('atic_user')) || null,
        os: null,
        logs: JSON.parse(localStorage.getItem('atic_logs')) || []
    };

    const html5QrCode = new Html5Qrcode("reader");

    // --- REGRAS TÉCNICAS ---
    const REGEX_OS = /^[A-Z]{3}\d{5}\/\d{4}(#[A-Z])?$/;
    const TAMANHO_AMOSTRA = 8;

    // --- INTERFACE ---
    function updateUI() {
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-os').classList.add('hidden');
        document.getElementById('section-amostra').classList.add('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        document.querySelectorAll('[id^="step"]').forEach(s => s.classList.remove('step-active'));

        if (!appState.user) {
            document.getElementById('section-login').classList.remove('hidden');
            document.getElementById('step1').classList.add('step-active');
        } else if (!appState.os) {
            document.getElementById('section-os').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('display-user').innerText = appState.user.nome;
            document.getElementById('step2').classList.add('step-active');
        } else {
            document.getElementById('section-amostra').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.getElementById('display-os').innerText = appState.os;
            document.getElementById('step3').classList.add('step-active');
        }

        document.getElementById('metric-total').innerText = appState.logs.length;
        renderLogs();
    }

    // --- CÂMERA E SCANNER ---
    async function startScanning(type) {
        if (html5QrCode.getState() !== 1) await html5QrCode.stop();

        document.getElementById('main-panel').classList.add('hidden');
        document.getElementById('scanner-container').classList.remove('hidden');
        
        const config = { 
            fps: 20, 
            qrbox: { width: 280, height: 180 },
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.QR_CODE, 
                Html5QrcodeSupportedFormats.ITF 
            ]
        };

        html5QrCode.start({ facingMode: "environment" }, config, (text) => {
            processData(type, text);
        }).catch(err => {
            alert("Erro ao abrir câmera. Verifique as permissões HTTPS.");
            stopScanning();
        });
    }

    async function stopScanning() {
        if (html5QrCode.getState() !== 1) await html5QrCode.stop();
        document.getElementById('scanner-container').classList.add('hidden');
        document.getElementById('main-panel').classList.remove('hidden');
    }

    // --- PROCESSAMENTO DE DADOS ---
    async function processData(type, data) {
        const value = data.trim().toUpperCase();

        if (type === 'LOGIN') {
            const parts = value.split(';');
            if (parts.length >= 2) {
                appState.user = { nome: parts[0], id: parts[1] };
                localStorage.setItem('atic_user', JSON.stringify(appState.user));
                await finalizeAction();
            } else {
                alert("QR Code de Login Inválido!");
            }
        } 
        
        else if (type === 'OS') {
            if (REGEX_OS.test(value)) {
                appState.os = value;
                await finalizeAction();
            } else {
                alert("OS Inválida! Padrão esperado: XXXNNNNN/YYYY");
            }
        } 
        
        else if (type === 'AMOSTRA') {
            // Validação 8 dígitos numéricos
            if (!/^\d+$/.test(value) || value.length !== TAMANHO_AMOSTRA) {
                alert("Erro, por favor refaça a leitura (O código deve ter exatamente 8 dígitos)");
                return;
            }
            
            // Validação de Duplicidade
            const duplicado = appState.logs.find(l => l.amostra === value && l.os === appState.os);
            if (duplicado) {
                alert("Atenção: Amostra " + value + " já foi coletada nesta OS!");
                return;
            }

            // Registro
            appState.logs.push({
                id: Date.now(),
                os: appState.os,
                amostra: value,
                usuario: appState.user.nome,
                dataHora: new Date().toLocaleString('pt-BR')
            });
            localStorage.setItem('atic_logs', JSON.stringify(appState.logs));
            await finalizeAction();
        }
    }

    async function finalizeAction() {
        triggerSplash();
        await stopScanning(); // Fecha automaticamente a câmera após sucesso
        updateUI();
    }

    function confirmManualOS() {
        const val = document.getElementById('manualOS').value;
        if(val) {
            processData('OS', val);
            document.getElementById('manualOS').value = "";
        }
    }

    // --- UTILITÁRIOS ---
    function triggerSplash() {
        const s = document.getElementById('splash');
        s.classList.remove('hidden');
        setTimeout(() => s.classList.add('hidden'), 900);
    }

    function trocarOS() { 
        appState.os = null; 
        updateUI(); 
    }

    function deleteLog(id) {
        if (confirm("Deseja realmente excluir este registro de amostra?")) {
            appState.logs = appState.logs.filter(l => l.id !== id);
            localStorage.setItem('atic_logs', JSON.stringify(appState.logs));
            updateUI();
        }
    }

    function renderLogs() {
        const list = document.getElementById('logTable');
        list.innerHTML = appState.logs.slice().reverse().map(l => `
            <tr class="hover:bg-slate-50 transition-colors">
                <td class="p-4">
                    <span class="text-[9px] text-slate-400 font-bold block uppercase leading-none">OS Ativa</span>
                    <span class="font-bold text-slate-700">${l.os}</span>
                </td>
                <td class="p-4">
                    <span class="font-black text-indigo-600 text-base tracking-tight">${l.amostra}</span>
                </td>
                <td class="p-4 text-slate-500 text-[10px] leading-tight">
                    ${l.dataHora}<br><span class="opacity-60">${l.usuario}</span>
                </td>
                <td class="p-4 text-center">
                    <button onclick="deleteLog(${l.id})" class="text-red-400 font-bold hover:text-red-600 text-xl px-2">×</button>
                </td>
            </tr>
        `).join('');
    }

    function exportToExcel() {
        if (appState.logs.length === 0) return alert("Não há dados para exportar.");
        
        const dadosFormatados = appState.logs.map(l => ({
            "Ordem de Serviço": l.os,
            "Número Amostra": l.amostra,
            "Data e Hora": l.dataHora,
            "Operador": l.usuario
        }));

        const ws = XLSX.utils.json_to_sheet(dadosFormatados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Amostras");
        
        // Estilização básica (largura das colunas)
        ws['!cols'] = [{wch:20}, {wch:20}, {wch:25}, {wch:20}];
        
        XLSX.writeFile(wb, `ATIC_COLETA_${new Date().getTime()}.xlsx`);
    }

    // --- EVENTOS ---
    document.getElementById('logoutBtn').addEventListener('click', () => {
        if(confirm("Deseja encerrar a sessão? Os registros locais serão mantidos.")) {
            localStorage.removeItem('atic_user');
            appState.user = null;
            appState.os = null;
            updateUI();
        }
    });

    document.getElementById('btnStopScan').addEventListener('click', stopScanning);

    // Inicialização
    updateUI();
  </script>
</body>
</html>
